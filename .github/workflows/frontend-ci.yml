name: Frontend CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint-and-format-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Windows-friendly line endings
        run: git config core.autocrlf true

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Cài đặt dependencies (bao gồm @eslint/js, vitest)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run lint
        run: pnpm lint

      - name: Run server-v4 lint
        run: pnpm run lint:server-v4

      - name: Check formatting (CRLF)
        run: pnpm format:check

  test-ubuntu:
    runs-on: ubuntu-latest
    needs: lint-and-format-windows
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.4.1
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "pnpm"

      - name: Cài đặt dependencies (bao gồm @eslint/js, vitest)
        run: pnpm install --frozen-lockfile --prod=false

      - name: Run server-v4 typecheck
        run: pnpm run typecheck:server-v4

      - name: Run server-v4 tests
        run: pnpm run test:server-v4

      - name: Run repo smoke gate
        run: pnpm run test:smoke:core

      - name: Contract verification (fail on new gaps)
        run: pnpm run api:contract:ci
